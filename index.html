<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tampilan Gambar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
            flex-direction: column;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        .container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
        .caption {
            margin-top: 15px;
            text-align: center;
            color: #4b5563;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ✅ Kode gambar yang benar untuk struktur root/images/ -->
        <img src="images/foto-saya.jpg" alt="Foto saya dari folder images">
        <p class="caption">📸 Ini adalah gambar dari folder images</p>
    </div>
</body>
</html>
