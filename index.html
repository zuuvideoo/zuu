<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigasi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="app-wrapper" id="appWrapper">
        <!-- ===== HEADER ===== -->
        <header class="app-header">
            <div class="header-left">
                <span class="app-title">zuuvideoo</span>
            </div>
            <div class="header-right">
                <button class="btn-theme" onclick="toggleDarkMode()" title="Mode Gelap/Terang">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </header>

        <!-- ===== NAVIGASI UTAMA ===== -->
        <div class="nav-container">
            <div class="nav-header">
                <h2 class="nav-title">Navigasi</h2>
                <div class="action-buttons">
                    <button class="btn-action btn-hide" onclick="toggleHideLabels()" title="Tampilkan/Sembunyikan teks">
                        <i class="fas fa-font"></i> <span id="hideLabel">Sembunyikan</span>
                    </button>
                    <button class="btn-action btn-tambah" onclick="bukaModalTambah()">
                        <i class="fas fa-plus"></i> Tambah
                    </button>
                    <button class="btn-action btn-edit" onclick="bukaModalPilih('edit')">
                        <i class="fas fa-pen"></i> Edit
                    </button>
                    <button class="btn-action btn-hapus" onclick="bukaModalPilih('hapus')">
                        <i class="fas fa-trash"></i> Hapus
                    </button>
                </div>
            </div>

            <ul class="nav-list" id="menuList"></ul>
        </div>
    </div>

    <!-- ===== MODAL TAMBAH ===== -->
    <div class="modal-overlay" id="modalTambah">
        <div class="modal-box">
            <h3 class="modal-title"><i class="fas fa-plus-circle"></i> Tambah Menu</h3>
            <div class="modal-group">
                <label>Nama Menu</label>
                <input type="text" id="inputNama" placeholder="Nama menu..." />
            </div>
            <div class="modal-group">
                <label>URL / Pintasan</label>
                <div style="display:flex;gap:8px;">
                    <input type="url" id="inputUrl" placeholder="https://..." value="#" style="flex:1;" />
                    <button type="button" class="btn-shortcut" onclick="setUrlFromNama('inputNama','inputUrl')">
                        <i class="fas fa-magic"></i> .html
                    </button>
                </div>
            </div>
            <div class="modal-group">
                <label>Pilih Ikon</label>
                <div class="ikon-grid" id="ikonGrid"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-batal" onclick="tutupModal('modalTambah')">Batal</button>
                <button class="btn-simpan" onclick="simpanTambah()"><i class="fas fa-save"></i> Simpan</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL PILIH ===== -->
    <div class="modal-overlay" id="modalPilih">
        <div class="modal-box">
            <h3 class="modal-title" id="modalPilihTitle"><i class="fas fa-pen"></i> Pilih Menu</h3>
            <div class="modal-group">
                <label>Klik salah satu menu di bawah ini:</label>
                <ul class="pilihan-menu" id="pilihanMenuList"></ul>
            </div>
            <div class="modal-actions">
                <button class="btn-batal" onclick="tutupModal('modalPilih')">Batal</button>
                <button class="btn-simpan" id="btnLanjut" onclick="lanjutPilih()"><i class="fas fa-arrow-right"></i> Lanjut</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL EDIT ===== -->
    <div class="modal-overlay" id="modalEdit">
        <div class="modal-box">
            <h3 class="modal-title"><i class="fas fa-pen"></i> Edit Menu</h3>
            <div class="modal-group">
                <label>Nama Menu</label>
                <input type="text" id="editNama" />
            </div>
            <div class="modal-group">
                <label>URL / Pintasan</label>
                <div style="display:flex;gap:8px;">
                    <input type="url" id="editUrl" value="#" style="flex:1;" />
                    <button type="button" class="btn-shortcut" onclick="setUrlFromNama('editNama','editUrl')">
                        <i class="fas fa-magic"></i> .html
                    </button>
                </div>
            </div>
            <div class="modal-group">
                <label>Pilih Ikon</label>
                <div class="ikon-grid" id="editIkonGrid"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-batal" onclick="tutupModal('modalEdit')">Batal</button>
                <button class="btn-simpan" onclick="simpanEdit()"><i class="fas fa-save"></i> Update</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
