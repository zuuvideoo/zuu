<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pengaturan - Navigasi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        .settings-card {
            background: white;
            max-width: 440px;
            width: 100%;
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            transition: background 0.3s, color 0.3s;
        }
        .settings-card h2 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            color: #0f172a;
        }
        .settings-card h2 i {
            color: #3b82f6;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: #334155;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .form-group.color-picker {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .form-group.color-picker input[type="color"] {
            width: 64px;
            height: 64px;
            padding: 4px;
            border-radius: 12px;
            cursor: pointer;
            background: white;
            border: 1px solid #cbd5e1;
        }
        .preview-box {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: background 0.3s;
        }
        .preview-icon {
            font-size: 28px;
            color: #3b82f6;
            width: 52px;
            height: 52px;
            background: #dbeafe;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .preview-text {
            font-weight: 600;
            font-size: 18px;
            color: #0f172a;
        }
        .preview-desc {
            font-size: 13px;
            color: #64748b;
        }
        .btn-save {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-save:hover {
            background: #2563eb;
        }
        .btn-save:active {
            transform: scale(0.97);
        }
        .btn-back {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        .btn-back:hover {
            text-decoration: underline;
        }
        /* Dark mode untuk preview */
        body.dark-preview {
            background: #0f172a;
        }
        body.dark-preview .settings-card {
            background: #1e293b;
            color: #f1f5f9;
        }
        body.dark-preview .settings-card h2 {
            color: #f1f5f9;
        }
        body.dark-preview .form-group label {
            color: #cbd5e1;
        }
        body.dark-preview .form-group input,
        body.dark-preview .form-group select {
            background: #334155;
            border-color: #475569;
            color: #f1f5f9;
        }
        body.dark-preview .preview-box {
            background: #334155;
        }
        body.dark-preview .preview-text {
            color: #f1f5f9;
        }
        body.dark-preview .preview-desc {
            color: #94a3b8;
        }
        body.dark-preview .preview-icon {
            background: #475569;
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="settings-card">
        <h2><i class="fas fa-sliders-h"></i> Pengaturan</h2>

        <div class="preview-box" id="previewBox">
            <div class="preview-icon"><i class="fas fa-bars"></i></div>
            <div>
                <div class="preview-text" id="previewText">Navigasi</div>
                <div class="preview-desc" id="previewDesc">Tema: Terang · Latar: #f1f5f9</div>
            </div>
        </div>

        <div class="form-group">
            <label><i class="fas fa-palette"></i> Tema</label>
            <select id="inputTheme">
                <option value="light">☀️ Terang</option>
                <option value="dark">🌙 Gelap</option>
            </select>
        </div>

        <div class="form-group color-picker">
            <label><i class="fas fa-fill-drip"></i> Warna Latar (mode terang)</label>
            <input type="color" id="inputBgColor" value="#f1f5f9" />
        </div>

        <button class="btn-save" id="saveSettings"><i class="fas fa-save"></i> Simpan Pengaturan</button>
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali ke Navigasi</a>
    </div>

    <script>
        (function() {
            const inputTheme = document.getElementById('inputTheme');
            const inputBgColor = document.getElementById('inputBgColor');
            const previewBox = document.getElementById('previewBox');
            const previewText = document.getElementById('previewText');
            const previewDesc = document.getElementById('previewDesc');
            const body = document.body;

            function loadSettings() {
                const theme = localStorage.getItem('nav_theme') || 'light';
                const bgColor = localStorage.getItem('nav_bgColor') || '#f1f5f9';
                inputTheme.value = theme;
                inputBgColor.value = bgColor;
                updatePreview(theme, bgColor);
            }

            function updatePreview(theme, bgColor) {
                // Update preview box
                if (theme === 'dark') {
                    body.classList.add('dark-preview');
                    previewBox.style.background = '#334155';
                    previewText.style.color = '#f1f5f9';
                    previewDesc.style.color = '#94a3b8';
                    previewDesc.textContent = `Tema: Gelap · Latar: #1e293b`;
                } else {
                    body.classList.remove('dark-preview');
                    previewBox.style.background = '#f1f5f9';
                    previewText.style.color = '#0f172a';
                    previewDesc.style.color = '#64748b';
                    previewDesc.textContent = `Tema: Terang · Latar: ${bgColor}`;
                }
            }

            function saveSettings() {
                const theme = inputTheme.value;
                const bgColor = inputBgColor.value;
                localStorage.setItem('nav_theme', theme);
                localStorage.setItem('nav_bgColor', bgColor);
                updatePreview(theme, bgColor);
                alert('✅ Pengaturan berhasil disimpan!');
            }

            document.getElementById('saveSettings').addEventListener('click', saveSettings);
            inputTheme.addEventListener('change', function() {
                const theme = this.value;
                const bgColor = inputBgColor.value;
                updatePreview(theme, bgColor);
            });
            inputBgColor.addEventListener('input', function() {
                const theme = inputTheme.value;
                const bgColor = this.value;
                updatePreview(theme, bgColor);
            });

            window.addEventListener('DOMContentLoaded', loadSettings);
        })();
    </script>
</body>
</html>
